# Gate register (realization "Gate entry and subject lifecycle").
# One row per gate session of noxfile.py: session, owner (TU) and state (active or pending).
# Only `evidence` (owner TU-02) and `docs` (owner TU-19) may be pending; an active gate never
# returns to pending. `green`, `acceptance` and `installed` are not gate sessions.

