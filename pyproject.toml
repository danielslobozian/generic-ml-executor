[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generic-ml-executor"
dynamic = ["version"]
description = "Drive ML coding clients and model APIs from Python, with a gateway to observe and control each client's own traffic."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Daniel Slobozian" }]
keywords = ["llm", "coding-agent", "gateway", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
# No runtime dependency yet: each one is added by the change whose library code
# first imports it (RV-09(b) checks this on every commit).
dependencies = []

[project.urls]
Repository = "https://github.com/danielslobozian/generic-ml-executor"
Changelog = "https://github.com/danielslobozian/generic-ml-executor/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "nox>=2026.10.20",
  "pytest>=9.2",
  "pytest-cov>=6.2",
  "pytest-timeout>=2.4",
  "hypothesis>=6.135",
  "ruff>=0.12",
  "pyright==1.1.414",
  "import-linter>=2.3",
  "complexipy>=3.3",
  "pip-audit>=2.9",
  "detect-secrets>=1.5",
  "pip-licenses>=5.0",
  "zizmor>=1.11",
  "griffe>=1.7",
  "trustme>=1.2",
  "pyte>=0.8.2",
  "ptyprocess>=0.7; sys_platform != 'win32'",
  "pywinpty>=2.0.15; sys_platform == 'win32'",
  "pre-commit>=4.2",
  "pysonar>=1.1",
  "psutil>=7.0",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9][^\\s]*)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/generic_ml_executor"]

[tool.hatch.build.targets.sdist]
include = ["src/generic_ml_executor", "VERSION", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.uv]
required-version = "==0.12.5"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "."]

[tool.ruff.lint]
# The family's strict rule set, plus McCabe complexity (C90) with max-complexity 10.
select = [
  "E", "W", "F", "I", "N", "UP", "B", "BLE", "A", "C4", "SIM", "PTH", "RET", "ARG",
  "PT", "TID", "PL", "TRY", "RUF", "ANN", "D", "S", "C90",
]
# D203/D213 conflict with D211/D212 under the Google convention.
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests assert with `assert`, compare with literal expectations and run tools as subprocesses.
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
# Gate tools and the nox file run Git and the gate tools as subprocesses with fixed arguments.
"tools/**" = ["S603", "S607"]
"noxfile.py" = ["S603", "S607"]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
timeout = 300
markers = [
  "case(identity): the acceptance case of acceptance/target-cases.toml that the test implements",
]

[tool.complexipy]
max-complexity-allowed = 15
