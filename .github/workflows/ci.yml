# Every cell of the matrix runs the complete gate entry point, as locally.
# The roll-up job `ci` is one of the two checks branch protection on main requires.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: green (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Run every active gate
        run: uv run --frozen nox -s green
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload the cell report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: results/
          if-no-files-found: error

  ci:
    name: ci
    needs: [cell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every cell to have succeeded
        env:
          CELLS: ${{ needs.cell.result }}
        run: |
          echo "matrix result: $CELLS"
          test "$CELLS" = "success"
